# As senhas vem de variaveis de ambiente (ou de um arquivo .env nesta pasta,
# que NAO vai para o git). Veja o .env.example.

services:
  db:
    image: mysql:8.0
    container_name: mysql-monitoria
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: portal_monitoria
    ports:
      # Somente nesta maquina (127.0.0.1); nao fica acessivel pela rede.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Para importar um dump na primeira subida, coloque o .sql em
      # /docker-entrypoint-initdb.d/ e descomente (ajuste o caminho):
      # - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql

  redis:
    image: redis:alpine
    container_name: redis-monitoria
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:

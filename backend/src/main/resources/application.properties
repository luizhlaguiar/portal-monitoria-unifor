server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/portal_monitoria?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Origem permitida do frontend (CORS e WebSocket). No deploy, defina ALLOWED_ORIGIN.
app.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}
# Chave do JWT (minimo 32 caracteres). Sem ela, uma chave aleatoria e gerada a cada subida.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-hours=${JWT_TTL_HOURS:8}

# No deploy: DDL_AUTO=validate (ou none) e SHOW_SQL=false
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

